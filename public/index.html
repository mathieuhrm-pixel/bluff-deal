<body>
<style>:root {
  color-scheme: dark;
  --bg: #14121f;
  --bg2: #1c1930;
  --panel: #231f3a;
  --panel2: #2c2748;
  --line: #3a3460;
  --text: #f3f0ff;
  --muted: #a9a2c9;
  --gold: #ffc94a;
  --gold2: #ffad1f;
  --A: #ff7a6b;
  --B: #4fd6c8;
  --good: #5ee08a;
  --bad: #ff5d73;
  --purple: #9b7bff;
  --radius: 16px;
  --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  --font: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  --display: 'Bricolage Grotesque', var(--font);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.45; }
body { min-height: 100vh; background: radial-gradient(1200px 600px at 10% -10%, #2b2156 0%, transparent 60%), radial-gradient(900px 500px at 110% 10%, #1d3b4a 0%, transparent 55%), var(--bg); background-attachment: fixed; }
a { color: var(--gold); }
h1, h2, h3, h4 { font-family: var(--display); margin: 0 0 .5em; line-height: 1.15; }
h1 { font-size: clamp(2rem, 6vw, 3.4rem); font-weight: 800; letter-spacing: -.02em; }
h2 { font-size: 1.5rem; font-weight: 800; }
h3 { font-size: 1.12rem; font-weight: 700; }
p { margin: 0 0 .7em; }
small, .muted { color: var(--muted); }
.boot { padding: 40px; text-align: center; font-size: 1.4rem; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 18px 16px 90px; }
.narrow { max-width: 760px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack > * + * { margin-top: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.hidden { display: none !important; }
.center { text-align: center; }

/* Boutons */
button, .btn { font: inherit; cursor: pointer; border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 600; background: var(--panel2); color: var(--text); transition: transform .08s, background .15s, opacity .15s; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
button:hover, .btn:hover { background: #38315c; }
button:active { transform: scale(.97); }
button:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn-gold { background: linear-gradient(180deg, var(--gold), var(--gold2)); color: #2a1b00; }
.btn-gold:hover { background: linear-gradient(180deg, #ffd66e, #ffb83a); }
.btn-good { background: var(--good); color: #062612; }
.btn-good:hover { background: #7ff0a3; }
.btn-bad { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
.btn-bad:hover { background: rgba(255, 93, 115, .12); }
.btn-ghost { background: transparent; border: 1px solid var(--line); }
.btn-big { padding: 14px 22px; font-size: 1.05rem; border-radius: 14px; }
.btn-sm { padding: 6px 10px; font-size: .85rem; border-radius: 10px; }
.btn-block { width: 100%; }

input, select, textarea { font: inherit; color: var(--text); background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--purple); border-color: transparent; }
textarea { min-height: 70px; resize: vertical; }
label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 4px; color: var(--muted); }
.field { margin-bottom: 12px; }

/* Panneaux */
.panel { background: linear-gradient(180deg, var(--panel), #201c35); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.panel h3 { display: flex; align-items: center; gap: 8px; }
.panel.secret { border-color: #6a4cff55; background: linear-gradient(180deg, #2a2050, #211b3d); }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font-size: .78rem; font-weight: 700; background: var(--panel2); color: var(--muted); white-space: nowrap; }
.tag.gold { background: #ffc94a22; color: var(--gold); }
.tag.A { background: #ff7a6b22; color: var(--A); }
.tag.B { background: #4fd6c822; color: var(--B); }
.tag.good { background: #5ee08a22; color: var(--good); }
.tag.bad { background: #ff5d7322; color: var(--bad); }
.tA { color: var(--A); } .tB { color: var(--B); }

/* Accueil */
.hero { text-align: center; padding: 30px 0 10px; }
.hero .logo { font-size: 4rem; display: block; margin-bottom: 4px; filter: drop-shadow(0 8px 20px rgba(255, 201, 74, .35)); animation: float 4s ease-in-out infinite; }
.hero h1 span { background: linear-gradient(90deg, var(--gold), #ff8d6b, var(--purple)); -webkit-background-clip: text; background-clip: text; color: transparent; }
@keyframes float { 50% { transform: translateY(-8px) rotate(-4deg); } }
.menu-card { cursor: pointer; text-align: left; display: block; padding: 18px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--panel); transition: transform .12s, border-color .12s; color: var(--text); }
.menu-card:hover { transform: translateY(-3px); border-color: var(--gold); background: var(--panel); }
.menu-card .ico { font-size: 1.8rem; }
.menu-card b { display: block; font-family: var(--display); font-size: 1.1rem; margin: 6px 0 2px; }

/* Lobby */
.code-big { font-family: var(--display); font-size: 2.6rem; font-weight: 800; letter-spacing: .25em; color: var(--gold); }
.qr { background: #fff; padding: 10px; border-radius: 12px; display: inline-block; line-height: 0; }
.qr img, .qr svg { width: 170px; height: 170px; image-rendering: pixelated; }
.team-box { border-radius: 14px; padding: 12px; border: 2px dashed var(--line); min-height: 120px; }
.team-box.A { border-color: #ff7a6b66; background: #ff7a6b0d; }
.team-box.B { border-color: #4fd6c866; background: #4fd6c80d; }
.player-chip { display: flex; align-items: center; gap: 8px; background: var(--bg2); border-radius: 10px; padding: 8px 10px; margin: 6px 0; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--good); flex: none; }
.dot.off { background: var(--bad); }
.seg { display: inline-flex; background: var(--bg2); border-radius: 12px; padding: 4px; gap: 4px; flex-wrap: wrap; }
.seg button { background: transparent; padding: 7px 12px; border-radius: 9px; }
.seg button.on { background: var(--gold); color: #2a1b00; }

/* Jeu */
.topbar { position: sticky; top: 0; z-index: 20; background: rgba(20, 18, 31, .88); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topbar .inner { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.topbar .title { font-family: var(--display); font-weight: 800; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.timer { font-family: var(--display); font-weight: 800; font-size: 1.9rem; font-variant-numeric: tabular-nums; padding: 2px 14px; border-radius: 12px; background: var(--bg2); border: 1px solid var(--line); }
.timer.warn { color: var(--gold); border-color: var(--gold); }
.timer.danger { color: var(--bad); border-color: var(--bad); animation: pulse 1s infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }
.game-grid { display: grid; grid-template-columns: 1fr 1.25fr 1fr; gap: 14px; align-items: start; }
.col > * + * { margin-top: 14px; }
.tabs { display: none; }
@media (max-width: 980px) {
  .game-grid { grid-template-columns: 1fr; }
  .game-grid [data-tab]:not(.active) { display: none; }
  .col > [data-tab] + [data-tab] { margin-top: 0; }
  .tabs { display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; background: rgba(20, 18, 31, .95); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); gap: 4px; }
  .tabs button { flex: 1; flex-direction: column; gap: 2px; padding: 6px 4px; font-size: .75rem; background: transparent; position: relative; }
  .tabs button .ico { font-size: 1.3rem; }
  .tabs button.on { background: var(--panel2); color: var(--gold); }
  .tabs .badge { position: absolute; top: 2px; right: 18%; background: var(--bad); color: #fff; border-radius: 999px; font-size: .68rem; padding: 0 6px; }
  .timer { font-size: 1.5rem; }
  .topbar .title { font-size: .95rem; }
}

.pitch { font-size: .95rem; color: #dcd6f7; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: .92rem; }

/* Cartes à jouer */
.card { position: relative; border-radius: 14px; padding: 14px; background: linear-gradient(160deg, #fffaf0, #f3e7cf); color: #2b2233; box-shadow: 0 6px 18px rgba(0, 0, 0, .35); border: 3px solid #fff; }
.card .card-kind { font-size: .7rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; opacity: .6; }
.card .card-title { font-family: var(--display); font-weight: 800; font-size: 1.1rem; margin: 2px 0 6px; }
.card .big-emoji { font-size: 2rem; line-height: 1; }
.card.batna { background: linear-gradient(160deg, #e6fff0, #c3f2d6); }
.card.batna.ghost { background: linear-gradient(160deg, #ece8ff, #cfc5ff); }
.card.motiv { background: linear-gradient(160deg, #fff1f5, #ffd0dd); }
.card.boss { background: linear-gradient(160deg, #2b2b2b, #111); color: #f5f5f5; border-color: var(--gold); }
.card.event { background: linear-gradient(160deg, #fff7d6, #ffe08a); }
.card.arg { cursor: default; }
.card.arg.bluff { background: linear-gradient(160deg, #ffe9e3, #ffc2b2); }
.card .value { font-family: var(--display); font-weight: 800; font-size: 1.8rem; }
.card .stamp { position: absolute; top: 10px; right: 10px; font-size: .7rem; font-weight: 800; padding: 3px 8px; border-radius: 6px; background: #2b2233; color: #fff; transform: rotate(4deg); }
.card .stamp.bluff { background: #d7263d; }
.hand { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.hand .card { padding: 12px; font-size: .86rem; }

/* Table des points */
table.pts { width: 100%; border-collapse: collapse; font-size: .86rem; }
table.pts th, table.pts td { padding: 6px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.pts th { color: var(--muted); font-weight: 600; }
table.pts td.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.w-bar { height: 5px; background: var(--bg2); border-radius: 4px; overflow: hidden; margin-top: 3px; }
.w-bar i { display: block; height: 100%; background: var(--gold); }

/* Constructeur d'offre */
.issue-pick { margin-bottom: 12px; }
.issue-pick .name { font-weight: 700; margin-bottom: 6px; display: flex; justify-content: space-between; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 7px 10px; border-radius: 10px; background: var(--bg2); border: 1px solid var(--line); font-size: .86rem; font-weight: 500; }
.chip .p { font-size: .72rem; color: var(--gold); margin-left: 4px; font-weight: 700; }
.chip.on { background: var(--purple); border-color: var(--purple); color: #fff; }
.chip.on .p { color: #fff; }
.total-line { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: var(--bg2); border-radius: 12px; margin: 10px 0; }
.total-line b { font-family: var(--display); font-size: 1.4rem; }
.offer-card { border-radius: 14px; padding: 12px; border: 2px solid var(--line); background: var(--bg2); }
.offer-card.incoming { border-color: var(--gold); box-shadow: 0 0 0 4px #ffc94a22; animation: glow 1.6s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 8px #ffc94a10; } }
.offer-card ul { margin: 6px 0; padding-left: 18px; }
.warn-box { padding: 8px 12px; border-radius: 10px; background: #ff5d7318; color: #ffb3bf; font-size: .86rem; }
.ok-box { padding: 8px 12px; border-radius: 10px; background: #5ee08a18; color: #b4f5c8; font-size: .86rem; }
.info-box { padding: 8px 12px; border-radius: 10px; background: #9b7bff1c; color: #d5c9ff; font-size: .86rem; }

/* Journal & chat */
.log { max-height: 280px; overflow: auto; font-size: .86rem; display: flex; flex-direction: column; gap: 6px; }
.log .item { padding: 6px 9px; border-radius: 9px; background: var(--bg2); }
.log .item.private { border-left: 3px solid var(--purple); }
.chat { max-height: 240px; overflow: auto; display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.msg { padding: 7px 10px; border-radius: 12px; background: var(--bg2); font-size: .9rem; max-width: 92%; }
.msg.me { align-self: flex-end; background: #3b2f73; }
.msg .who { font-size: .72rem; font-weight: 700; }
.msg.team { border: 1px dashed var(--purple); }

/* Modale */
.modal-back { position: fixed; inset: 0; background: rgba(8, 6, 16, .78); backdrop-filter: blur(4px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; animation: fade .2s; }
.modal { width: min(460px, 100%); max-height: 92vh; overflow: auto; }
.modal .card { padding: 22px; animation: flip .55s cubic-bezier(.2, .9, .3, 1.2); }
.modal .card .card-title { font-size: 1.5rem; }
.modal .big-emoji { font-size: 3.4rem; }
@keyframes flip { from { transform: rotateY(90deg) scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } }
.who-for { display: inline-block; margin-top: 4px; font-size: .78rem; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: #2b2233; color: #fff; }

/* Toasts */
#toasts { position: fixed; top: 70px; right: 14px; left: 14px; z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
.toast { pointer-events: auto; background: var(--panel2); border: 1px solid var(--line); padding: 10px 14px; border-radius: 12px; box-shadow: var(--shadow); max-width: 380px; animation: slide .25s; font-size: .92rem; }
.toast.err { border-color: var(--bad); }
@keyframes slide { from { transform: translateX(30px); opacity: 0; } }

/* Révélation */
.banner { text-align: center; padding: 26px 16px; border-radius: 20px; margin-bottom: 16px; background: linear-gradient(135deg, #3a2a7a, #1f3b5a); border: 1px solid var(--line); }
.banner .big { font-size: 3.4rem; }
.banner h1 { margin: 6px 0; }
.banner.win { background: linear-gradient(135deg, #1d6b45, #1f3b5a); }
.banner.lose { background: linear-gradient(135deg, #6b1d3a, #2b1f4a); }
.score-big { font-family: var(--display); font-weight: 800; font-size: 2.6rem; }
.lines { list-style: none; margin: 8px 0; padding: 0; font-size: .9rem; }
.lines li { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
.lines li b.pos { color: var(--good); } .lines li b.neg { color: var(--bad); }
.title-badge { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 14px; background: var(--bg2); margin: 10px 0; }
.title-badge .e { font-size: 2.4rem; }
.meter { height: 14px; border-radius: 8px; background: var(--bg2); overflow: hidden; position: relative; }
.meter i { position: absolute; top: 0; bottom: 0; left: 0; background: linear-gradient(90deg, var(--purple), var(--gold)); border-radius: 8px; }
.meter .target { position: absolute; top: -4px; bottom: -4px; width: 3px; background: #fff; }
.stars button { background: transparent; font-size: 1.6rem; padding: 2px 4px; }

/* Banque & création */
.sc-card { display: flex; flex-direction: column; gap: 6px; }
.sc-card .em { font-size: 2rem; }
.sc-card p { font-size: .9rem; color: #d6d0f2; flex: 1; }
.issue-editor { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; background: var(--bg2); }

/* Règles */
.rules h2 { margin-top: 28px; }
.rules li { margin-bottom: 6px; }
.concept { display: grid; grid-template-columns: 2.2rem 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.concept .e { font-size: 1.6rem; }

/* Impression */
.print-sheet { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.print-sheet .card { min-height: 220px; page-break-inside: avoid; break-inside: avoid; }
.print-sheet .card .qr { padding: 4px; }
.print-sheet .card .qr img { width: 90px; height: 90px; }
@media print {
  body { background: #fff; color: #000; }
  .no-print, .topbar, .tabs, #toasts { display: none !important; }
  .wrap { padding: 0; max-width: none; }
  .print-sheet { grid-template-columns: repeat(3, 1fr); }
  .card { box-shadow: none; border: 1px solid #999; }
  h2 { color: #000; page-break-before: always; }
  h2:first-of-type { page-break-before: auto; }
}
@media (max-width: 700px) { .print-sheet { grid-template-columns: 1fr 1fr; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

libré·e",desc:"Tu as cherché un partage équitable."},{max:1.01,label:"Pro-self",desc:"Tu as maximisé ton propre résultat."}]};var I=[{id:"cafe",emoji:"☕",title:"La machine à café de la discorde",sector:"Achats B2B",type:"competitif",level:1,pitch:"La start-up NeuroBanane (40 salariés, 3 baby-foot, 0 café buvable) veut s'équiper de machines à café connectées. CaféTech, fournisseur premium, envoie son meilleur commercial. Le café est la seule chose qui maintient l'équipe tech éveillée.",concept:"BATNA et ancrage",debrief:"Qui a fait la première offre ? A-t-elle servi d'ancre pour la suite ?",roles:{A:{name:"Office manager de NeuroBanane",brief:"Le CFO a déjà refusé deux fois l'achat d'un canapé : ton budget est serré. L'équipe tech menace une grève du clavier si le café n'arrive pas avant le prochain sprint.",motivation:"Le CFO t'a promis le titre d'« Employé du mois » si tu fais baisser la facture.",batna:{value:30,text:"Un vendeur sur Leboncoin propose 3 cafetières italiennes d'occasion. Ça marche… à peu près."}},B:{name:"Commercial·e de CaféTech",brief:"Il te manque un contrat pour atteindre ton objectif trimestriel. Les machines, c'est la vitrine. La vraie marge de CaféTech, ce sont les capsules (le modèle « imprimante »).",motivation:"Ta prime dépend du volume de capsules vendues, pas du prix des machines. Chut.",batna:{value:30,text:"Une agence de pub est intéressée, mais elle veut négocier pendant 3 mois."}}},issues:[{name:"Prix par machine",options:["900 €","1 100 €","1 300 €","1 500 €"],A:{w:50,pref:"first"},B:{w:25,pref:"last"}},{name:"Livraison",options:["Demain","Dans 1 semaine","Dans 2 semaines","Dans 1 mois"],A:{w:20,pref:"first"},B:{w:30,pref:"last"}},{name:"Capsules offertes / mois",options:["2 000","1 000","500","0"],A:{w:30,pref:"first"},B:{w:45,pref:"last"}}]},{id:"dj",emoji:"🎤",title:"Le DJ du séminaire",sector:"Événementiel",type:"competitif",level:1,pitch:"Séminaire annuel de MégaAssur à Deauville. La DRH veut une soirée inoubliable. DJ Turbo Max, ex-star des années 2000 (« Ça va chauffer à la cafét », disque d'or 2004), est intéressé. Mais le budget… et l'ego…",concept:"Positions vs motivations",debrief:"Avez-vous compris ce qui comptait VRAIMENT pour l'autre ? À quel moment ?",roles:{A:{name:"DRH de MégaAssur",brief:"Le DG a coupé le budget communication de 30 %. Tu veux une vraie soirée, mais pas entendre « Ça va chauffer à la cafét » toute la nuit.",motivation:"Chaque euro économisé sur le cachet finance le bar à cocktails. Le bar, c'est ta réputation.",batna:{value:30,text:"Une playlist Spotify et l'enceinte Bluetooth du stagiaire."}},B:{name:"Agent de DJ Turbo Max",brief:"Turbo Max prépare son come-back. Il lui faut de la visibilité, une loge digne de son rang… et un peu d'argent.",motivation:"Le come-back passe par SA chanson. Si elle passe plusieurs fois, la vidéo devient virale.",batna:{value:25,text:"Un mariage à Lisieux le même soir : 1 200 €, buffet compris."}}},issues:[{name:"Cachet",options:["1 500 €","2 500 €","3 500 €","5 000 €"],A:{w:45,pref:"first"},B:{w:30,pref:"last"}},{name:"Durée du set",options:["1 h","2 h","3 h","4 h"],A:{w:20,pref:"last"},B:{w:15,pref:"first"}},{name:"« Ça va chauffer à la cafét »",options:["Jamais","1 fois","3 fois","En boucle"],A:{w:15,pref:"first"},B:{w:40,pref:"last"}},{name:"Loge",options:["Aucune","Chaise pliante","Loge simple","Loge + jacuzzi"],A:{w:20,pref:"first"},B:{w:15,pref:"last"}}]},{id:"chien",emoji:"🐶",title:"Le chien du PDG",sector:"Dialogue social",type:"semi",level:1,pitch:"Le PDG de LogiFrance vient au bureau avec Biscotte, son golden retriever. Résultat : 14 salariés veulent aussi venir avec leur animal (dont un iguane). Le CSE et la Direction doivent adopter une politique « animaux au bureau » avant vendredi. Sans accord, l'inspection du travail s'en mêle et tout le monde y perd.",concept:"Intérêts communs cachés",debrief:"Y avait-il un enjeu sur lequel vous vouliez la même chose ? L'avez-vous découvert ?",roles:{A:{name:"DRH (Direction)",brief:"Tu dois limiter les coûts et les risques (allergies, assurances). Mais tu sais que le PDG ne se séparera jamais de Biscotte.",motivation:"Le PDG t'a fait comprendre que ton bonus dépend du bonheur de Biscotte.",batna:{value:25,text:"Laisser l'inspection du travail trancher (avec le risque d'interdire aussi Biscotte)."}},B:{name:"Élu·e du CSE",brief:"Les salariés veulent l'égalité de traitement avec le chien du PDG. L'iguane de Kevin est devenu un symbole syndical.",motivation:"Ta base veut surtout le droit de venir avec TOUS les animaux. C'est ta réélection qui se joue.",batna:{value:25,text:"Lancer une pétition. 50 % de chances qu'elle soit ignorée."}}},issues:[{name:"Animaux autorisés",options:["Aucun","Chiens seulement","Chiens et chats","Tous, même l'iguane"],A:{w:30,pref:"first"},B:{w:35,pref:"last"}},{name:"Jours autorisés",options:["0 jour","1 jour / semaine","3 jours","Tous les jours"],A:{w:20,pref:"first"},B:{w:25,pref:"last"}},{name:"Espace dédié",options:["Aucun","Un coin du hall","Une salle dédiée","Parc canin sur le toit"],A:{w:15,pref:"first"},B:{w:10,pref:"last"}},{name:"Statut de Biscotte",options:["Interdite comme les autres","Tolérée","Autorisée en laisse","Mascotte officielle"],A:{w:35,pref:"last"},B:{w:30,pref:"last"}}]},{id:"noel",emoji:"🎄",title:"Les gardes de Noël",sector:"Hôpital / Management",type:"cooperatif",level:1,pitch:"Deux chefs de service doivent couvrir ensemble toutes les gardes du 24 décembre au 1er janvier. La direction ne validera le planning que s'il satisfait suffisamment les deux équipes (score commun minimum). Sinon : tirage au sort imposé, et tout le monde déprime.",concept:"Création de valeur (échanges de concessions)",debrief:"Avez-vous échangé des concessions sur des enjeux qui comptaient moins pour vous ?",roles:{A:{name:"Chef·fe des Urgences",brief:"Ton équipe a assuré le 24 décembre les trois dernières années. Elle menace de démissionner en bloc.",motivation:"Ton équipe veut ABSOLUMENT son réveillon du 24 en famille.",batna:{value:20,text:"Le tirage au sort de la direction. Ambiance garantie."}},B:{name:"Chef·fe de Pédiatrie",brief:"Ton équipe est jeune : le 24, ça lui est égal… mais le 31, c'est sacré (fêtes, concerts, voyages).",motivation:"Ton équipe veut absolument être libre le 31 décembre.",batna:{value:20,text:"Le tirage au sort de la direction. Ambiance garantie."}}},issues:[{name:"Gardes du 24 déc.",options:["Urgences seules","Surtout Urgences","Surtout Pédiatrie","Pédiatrie seule"],A:{w:40,pref:"last"},B:{w:10,pref:"first"}},{name:"Gardes du 31 déc.",options:["Urgences seules","Surtout Urgences","Surtout Pédiatrie","Pédiatrie seule"],A:{w:10,pref:"last"},B:{w:45,pref:"first"}},{name:"Budget intérim payé par",options:["Urgences","70 / 30","50 / 50","Pédiatrie"],A:{w:30,pref:"last"},B:{w:25,pref:"first"}},{name:"Le sapin du hall va chez",options:["Urgences","Pédiatrie"],A:{w:20,pref:"first"},B:{w:20,pref:"last"}}]},{id:"festival",emoji:"🎪",title:"Le Festival des Saveurs",sector:"Associatif / Événementiel",type:"cooperatif",level:1,pitch:"Deux associations co-organisent le festival « Saveurs du Monde » ce week-end. La mairie ne verse sa subvention de 10 000 € que si vous présentez un plan commun solide (score commun minimum). Sans plan : pas de subvention, pas de festival.",concept:"Préparation : Qui ? Quoi ? Comment ?",debrief:"Qu'auriez-vous dû préparer avant de vous asseoir à la table ?",roles:{A:{name:"Président·e de l'asso Food Trucks",brief:"Tes 12 food trucks vivent du flux de visiteurs. Plus la scène est proche, plus ils mangent.",motivation:"Les food trucks exigent que la scène soit juste à côté d'eux (sinon ils boycottent).",batna:{value:20,text:"Un petit marché de rue sans musique. Sympathique mais triste."}},B:{name:"Président·e de l'asso Concerts",brief:"Tes groupes ne jouent bien qu'à la nuit tombée. Le reste, tu es plutôt flexible.",motivation:"Les groupes refusent de jouer avant que le soleil soit couché.",batna:{value:20,text:"Un concert dans la salle des fêtes, 80 places, acoustique de piscine."}}},issues:[{name:"Subvention pour Food Trucks",options:["80 %","60 %","40 %","20 %"],A:{w:30,pref:"first"},B:{w:30,pref:"last"}},{name:"Horaires des concerts",options:["14 h – 18 h","16 h – 20 h","18 h – 22 h","20 h – minuit"],A:{w:20,pref:"last"},B:{w:40,pref:"last"}},{name:"Emplacement de la scène",options:["Près des food trucks","Au centre","Côté parking","Au bord du lac"],A:{w:40,pref:"first"},B:{w:10,pref:"last"}},{name:"Bénévoles",options:["Tous Food","Surtout Food","Surtout Concerts","Tous Concerts"],A:{w:10,pref:"first"},B:{w:20,pref:"last"}}]},{id:"chatbot",emoji:"🤖",title:"Le chatbot qui insultait les clients",sector:"Litige commercial / IA",type:"semi",level:2,pitch:"BanquePop a déployé « Gaston », un chatbot IA fourni par la start-up PromptMagic. Lundi, Gaston a répondu à 3 000 clients : « Votre demande est aussi passionnante qu'un tableur vide. » La capture est virale. Un procès ruinerait PromptMagic et exposerait BanquePop dans la presse pendant deux ans. Sans accord, tout le monde perd.",concept:"BATNA vs Ghost BATNA",debrief:"Le procès était-il vraiment une bonne solution de repli ? Qui bluffait ?",roles:{A:{name:"Directrice·teur digital de BanquePop",brief:"Le comité exécutif veut une sortie de crise rapide. Changer de fournisseur coûterait une fortune (Gaston est branché partout).",motivation:"Le DG veut que Gaston soit réparé AVANT la réunion des actionnaires.",batna:{value:35,text:"Procès : deux ans de procédure, gain incertain, presse garantie."}},B:{name:"CEO de PromptMagic",brief:"Tu n'as que 4 mois de trésorerie. BanquePop est ton plus gros client. Ton équipe peut corriger Gaston en quelques jours.",motivation:"Un gros remboursement = faillite. C'est l'argent qui compte avant tout.",batna:{value:25,text:"Lever des fonds en urgence auprès de ton oncle à Monaco."}}},issues:[{name:"Dédommagement",options:["0 €","50 k€","150 k€","300 k€"],A:{w:30,pref:"last"},B:{w:40,pref:"first"}},{name:"Délai du correctif",options:["48 h","1 semaine","1 mois","3 mois"],A:{w:35,pref:"first"},B:{w:15,pref:"last"}},{name:"Communication publique",options:["Silence total","Communiqué neutre","Excuses écrites","Excuses vidéo du CEO"],A:{w:20,pref:"last"},B:{w:30,pref:"first"}},{name:"Suite du contrat",options:["Résilié","1 an","2 ans","3 ans"],A:{w:15,pref:"last"},B:{w:15,pref:"last"}}]},{id:"transfert",emoji:"⚽",title:"Le transfert du siècle (en District 3)",sector:"Sport",type:"competitif",level:2,pitch:"Kevin « la Fusée » Martin, 34 ans, 12 buts en District 3, est courtisé par l'AS Saint-Glinglin. Son agent (qui est aussi son beau-frère) négocie avec la présidente du club. Le maire sera à la conférence de presse.",concept:"Mandat et relation principal / agent",debrief:"L'agent défendait-il les intérêts de Kevin… ou les siens ?",roles:{A:{name:"Présidente de l'AS Saint-Glinglin",brief:"Le club a 4 200 € en caisse et un bar associatif qui tourne bien. Kevin a 34 ans : un contrat long est risqué.",motivation:"La trésorerie est vide : la prime de signature doit rester minuscule.",batna:{value:30,text:"Recruter le fils du boulanger, 17 ans, prometteur mais imprévisible."}},B:{name:"Agent (et beau-frère) de Kevin",brief:"Kevin veut finir sa carrière en beauté. Toi, tu touches 10 % de la prime… et tu manges au bar du club.",motivation:"Kevin rêve d'un contrat long pour finir sa carrière ici.",batna:{value:30,text:"Le FC Trifouilly propose 600 € et un scooter."}}},issues:[{name:"Prime de signature",options:["Un survêtement","500 €","1 000 €","2 000 €"],A:{w:35,pref:"first"},B:{w:25,pref:"last"}},{name:"Numéro de maillot",options:["Le 23","Le 14","Le 9","Le 10"],A:{w:15,pref:"first"},B:{w:20,pref:"last"}},{name:"Durée du contrat",options:["6 mois","1 saison","2 saisons","3 saisons"],A:{w:20,pref:"first"},B:{w:40,pref:"last"}},{name:"Repas offerts au bar du club",options:["Aucun","1 / semaine","Tous les matchs","À vie"],A:{w:30,pref:"first"},B:{w:15,pref:"last"}}]},{id:"cantines",emoji:"🌱",title:"La fusion des cantines bio",sector:"Fusion / Agroalimentaire",type:"cooperatif",level:2,pitch:"VertCantine et Bio&Co fusionnent leurs cuisines centrales pour décrocher le marché des 40 écoles de la métropole. L'appel d'offres se termine ce soir. Si l'accord de fusion n'est pas assez solide (score commun minimum), vous perdez le marché tous les deux.",concept:"Création de valeur et intérêts compatibles",debrief:"Quel enjeu a débloqué la négociation ? Qui a osé partager une info en premier ?",roles:{A:{name:"Fondatrice·teur de VertCantine",brief:"Tu as apporté le plus de clients. Ta cuisine est vieillissante, honnêtement tu t'en fiches de la garder.",motivation:"Tes investisseurs exigent la majorité du capital. Non négociable (enfin… presque).",batna:{value:20,text:"Répondre seul·e à l'appel d'offres : 15 % de chances de gagner."}},B:{name:"Fondateur·trice de Bio&Co",brief:"Ta cuisine est neuve (2 M€ d'investissement, pas encore remboursés). Le capital t'importe moins que l'outil de production.",motivation:"Tu DOIS faire tourner ta cuisine neuve, sinon la banque te tombe dessus.",batna:{value:20,text:"Répondre seul·e à l'appel d'offres : 15 % de chances de gagner."}}},issues:[{name:"Nom de la nouvelle entité",options:["VertCantine","VertCantine & Bio&Co","Bio&Co Verte","Bio&Co"],A:{w:15,pref:"first"},B:{w:10,pref:"last"}},{name:"Site de production",options:["Cuisine VertCantine","Alternance","Nouveau site","Cuisine Bio&Co"],A:{w:10,pref:"first"},B:{w:45,pref:"last"}},{name:"Capital (VertCantine / Bio&Co)",options:["70 / 30","60 / 40","50 / 50","40 / 60"],A:{w:45,pref:"first"},B:{w:15,pref:"last"}},{name:"Repas végétariens",options:["1 jour / sem.","2 jours","3 jours","Tous les jours"],A:{w:30,pref:"last"},B:{w:30,pref:"last"}}]},{id:"influence",emoji:"📱",title:"Le placement produit de l'influenceuse",sector:"Marketing digital",type:"competitif",level:2,pitch:"La marque ProtéiNouille (des nouilles protéinées, si si) veut un partenariat avec @LéaFitMood (1,2 M d'abonnés). Lancement produit dans 3 semaines. Le manager de Léa négocie dur.",concept:"Critères de légitimité (justifier ses offres)",debrief:"Quels arguments ont vraiment convaincu ? Lesquels étaient du bluff ?",roles:{A:{name:"Responsable marketing de ProtéiNouille",brief:"Le lancement est dans 3 semaines. Le budget est limité, mais tu veux un maximum de contenus.",motivation:"Ton boss juge la campagne au coût par contenu : ça doit rester raisonnable.",batna:{value:30,text:"Un « nano-influenceur » (8 000 abonnés, dont sa grand-mère) à 1 k€."}},B:{name:"Manager de @LéaFitMood",brief:"Léa est en discussion avec d'autres marques. Une exclusivité longue lui fermerait des portes.",motivation:"Léa veut être payée à sa juste valeur : c'est une question d'image.",batna:{value:35,text:"Une marque de tisane détox propose 12 k€ (mais c'est imbuvable)."}}},issues:[{name:"Rémunération",options:["5 k€","10 k€","20 k€","35 k€"],A:{w:40,pref:"first"},B:{w:40,pref:"last"}},{name:"Contenus",options:["1 story","3 stories","1 vidéo","1 vidéo + 5 stories"],A:{w:30,pref:"last"},B:{w:10,pref:"first"}},{name:"Exclusivité",options:["Aucune","1 mois","6 mois","1 an"],A:{w:20,pref:"last"},B:{w:35,pref:"first"}},{name:"Contrôle de la marque",options:["Aucun","Relecture","Validation","Script imposé"],A:{w:10,pref:"last"},B:{w:15,pref:"first"}}]},{id:"augmentation",emoji:"💼",title:"Augmentation ou démission",sector:"RH / Négociation salariale",type:"semi",level:2,pitch:"Sam, data scientist star, a reçu une offre d'un concurrent. Sans Sam, le projet « Orion » s'effondre. Sam aime l'équipe, mais son loyer parisien n'aime personne. Sans accord : Sam part, Orion coule, tout le monde perd.",concept:"Solutions à la table (SAT) vs hors de la table",debrief:"Avez-vous élargi le gâteau (télétravail, titre…) au lieu de vous battre sur le salaire ?",roles:{A:{name:"Manager de Sam",brief:"Le budget RH est gelé cette année, mais tu as une marge sur l'année prochaine. Le télétravail ne te pose pas de vrai problème.",motivation:"Les RH refusent toute augmentation qui prenne effet avant l'année prochaine.",batna:{value:30,text:"Recruter un·e remplaçant·e : 6 mois, 25 k€ de cabinet, Orion en retard."}},B:{name:"Sam, data scientist star",brief:"Tu as déménagé à 1 h 30 du bureau. L'argent compte, mais les trajets te tuent.",motivation:"Ce qui compte le plus pour toi : ne plus passer 3 h par jour dans les transports.",batna:{value:35,text:"L'offre du concurrent : +15 %, mais 0 jour de télétravail et un open space de 300 personnes."}}},issues:[{name:"Augmentation",options:["+0 %","+5 %","+10 %","+18 %"],A:{w:30,pref:"first"},B:{w:30,pref:"last"}},{name:"Télétravail",options:["0 jour","1 jour","3 jours","100 % remote"],A:{w:15,pref:"first"},B:{w:35,pref:"last"}},{name:"Titre",options:["Data scientist","Senior","Lead","Chief Data Wizard"],A:{w:10,pref:"first"},B:{w:10,pref:"last"}},{name:"Date d'effet",options:["Dans 1 an","Dans 6 mois","Dans 3 mois","Immédiat"],A:{w:45,pref:"first"},B:{w:25,pref:"last"}}]},{id:"stade",emoji:"🏟️",title:"Le stade en retard",sector:"BTP / Marchés publics",type:"semi",level:3,pitch:"Le stade de Valmont-sur-Mer devait être livré pour la finale de la Coupe régionale dans 4 mois. Le chantier a 6 mois de retard. L'Agglo et le groupe Bâtifort doivent s'entendre. Sans accord : procès, finale annulée, élections perdues, faillite.",concept:"Parties prenantes et ordre de l'agenda",debrief:"Par quel enjeu avez-vous commencé ? Était-ce le bon choix (crescendo / décrescendo) ?",roles:{A:{name:"Vice-président·e de l'Agglo",brief:"Les élections ont lieu dans 6 mois. Une finale annulée serait un désastre politique. Le budget est voté, toute rallonge passe en conseil.",motivation:"Il te faut au moins une partie du stade pour la finale. Les électeurs regardent.",batna:{value:30,text:"Résilier et confier le chantier à un autre BTP (18 mois de retard en plus)."}},B:{name:"PDG de Bâtifort",brief:"Le retard vient en partie de modifications demandées par l'Agglo. Tes équipes sont épuisées, ta marge est déjà négative.",motivation:"Les pénalités de retard te mettraient en faillite. C'est ta ligne rouge.",batna:{value:30,text:"Un procès long : 50 % de chances de gagner."}}},issues:[{name:"Pénalités de retard",options:["0 €","500 k€","1,5 M€","3 M€"],A:{w:25,pref:"last"},B:{w:35,pref:"first"}},{name:"Rallonge budgétaire",options:["0 €","1 M€","2 M€","4 M€"],A:{w:30,pref:"first"},B:{w:30,pref:"last"}},{name:"Livraison pour la finale",options:["Rien","Tribune Nord seule","Pelouse + 2 tribunes","Stade complet"],A:{w:35,pref:"last"},B:{w:15,pref:"first"}},{name:"Équipes de nuit",options:["Non","Week-ends","3 nuits / sem.","Tous les soirs"],A:{w:10,pref:"last"},B:{w:20,pref:"first"}}]},{id:"studio",emoji:"🎮",title:"Le rachat du studio indé",sector:"Fusions-acquisitions",type:"semi",level:3,pitch:"Le studio PixelCanard (12 personnes, un jeu culte : « Canard Samouraï ») est racheté par le fonds GigaPlay Capital. Le studio n'a plus que 3 mois de trésorerie, et le fonds doit investir avant la fin de l'année fiscale. Sans accord, tout le monde perd.",concept:"Premières offres et concessions",debrief:"Comment ont évolué vos concessions ? De plus en plus petites (signal de limite) ?",roles:{A:{name:"Fondatrice·teur de PixelCanard",brief:"Tu as créé ce studio dans ton garage. L'argent compte, mais tu ne veux pas être viré·e au bout de 6 mois.",motivation:"Ton rêve : rester aux commandes du studio que tu as créé.",batna:{value:25,text:"Un Kickstarter pour « Canard Samouraï 2 ». Ou la faillite."}},B:{name:"Partner chez GigaPlay Capital",brief:"Ton comité d'investissement surveille le prix d'achat de près. L'earn-out limite ton risque.",motivation:"Ton comité te jugera d'abord sur le prix d'achat.",batna:{value:35,text:"Racheter LamaGames, moins talentueux mais moins cher."}}},issues:[{name:"Prix de rachat",options:["5 M€","8 M€","12 M€","15 M€"],A:{w:30,pref:"last"},B:{w:35,pref:"first"}},{name:"Earn-out (part variable)",options:["0 %","10 %","25 % ois pas. »","« Si tu ne l'obtiens pas, ne reviens pas. Enfin, reviens, mais à pied. »","« C'est non négociable. Enfin, négocie, mais obtiens-le. »","« Ton évaluation annuelle approche, je dis ça, je dis rien. »","« Fais ça pour moi et je te laisse le bureau avec fenêtre. »"],_e=["Facilité : qu'est-ce qui a été le plus difficile dans cette négociation ?","Satisfaction : es-tu satisfait·e du résultat ET de la relation avec l'autre camp ?","Méthode : si tu rejouais, que changerais-tu dans ta préparation ou ta stratégie ?"];var R=h.points,Ke=[{e:"🛟",t:"BATNA (MESORE)",d:"Best Alternative To a Negotiated Agreement : ta meilleure solution si la négociation échoue. Dans le jeu, c'est ta carte Plan B (en points). N'accepte jamais un accord qui vaut moins que ta BATNA."},{e:"👻",t:"Ghost BATNA",d:"Un faux plan B : une alternative qu'on croit avoir (ou qu'on fait croire avoir) mais qui ne vaut rien. Dans le jeu, la carte Plan B peut être un fantôme : tu peux bluffer, mais gare à qui la démasque."},{e:"🎯",t:"Positions vs motivations",d:"La position, c'est ce qu'on demande (« 5 000 € »). La motivation (l'intérêt), c'est pourquoi on le demande. Ta carte Motivation révèle ton enjeu n°1 : devine celui de l'autre camp."},{e:"🍰",t:"Création de valeur",d:"Échanger des concessions sur des enjeux qui comptent peu pour toi contre des gains sur ceux qui comptent beaucoup. Le gâteau grossit avant d'être partagé."},{e:"🤝",t:"Intérêts compatibles",d:"Certains enjeux sont voulus de la même façon par les deux camps. Encore faut-il le découvrir… en posant des questions."},{e:"🧭",t:"ZOPA",d:"Zone d'accord possible : l'ensemble des accords meilleurs que les deux BATNA."},{e:"⚖️",t:"Critères de légitimité",d:"Prix du marché, loi, précédent, norme, expertise… Justifier une offre la rend plus acceptable. Ce sont les cartes Argument."},{e:"🃏",t:"Tromperie et manipulation",d:"Bluff, faux ultimatum, fausse autorité limitée… Les cartes Argument « bluff » les font pratiquer, et contester permet d'apprendre à les détecter."},{e:"👔",t:"Mandat (principal / agent)",d:"Celui qui négocie (l'agent) agit pour quelqu'un d'autre (le principal). Dans le jeu, l'ordre secret du boss : ton coéquipier ne le connaît pas forcément."},{e:"⚓",t:"Ancrage et première offre",d:"La première offre chiffrée sert de point de référence à toute la suite. Ambitieuse, mais justifiable."},{e:"🗺️",t:"Parties prenantes",d:"Tous ceux qui influencent ou subissent l'accord : DG, CSE, électeurs, investisseurs… Ils apparaissent dans les rôles et les cartes Événement."},{e:"📋",t:"Préparation : Qui ? Quoi ? Comment ?",d:"Qui est en face ? Quels sont les enjeux et les priorités ? Comment mener la discussion (agenda, informations à partager) ?"},{e:"🧠",t:"SVO (orientation des valeurs sociales)",d:"Pro-self (maximiser son gain) ou prosocial (gain commun). L'écran de fin te donne ton orientation selon le partage obtenu."},{e:"📣",t:"Communication",d:"Quelles informations partager pour créer de la valeur, lesquelles garder pour ne pas être exploité ? La carte Événement « Fuite dans la presse » vous y oblige."}],Ye=`
<h2>🎯 Le but</h2>
<p>Deux camps (seul ou en équipe de 2) négocient le même scénario, mais chacun reçoit des <b>informations secrètes différentes</b>.
Vous avez <b>${Math.round(h.defaultDuration/60)} minutes</b> pour signer un accord… ou pas. À la fin, tout est révélé : plans B, motivations, bluffs et ordres secrets.</p>

<h2>🧩 Mise en place (1 minute)</h2>
<ol>
  <li>Un joueur clique sur <b>Créer une partie</b> et choisit le mode (duo ou équipes), le niveau et le scénario.</li>
  <li>Les autres scannent le <b>QR code</b> (ou tapent le code) sur leur propre téléphone ou ordinateur.</li>
  <li>Chacun rejoint un camp (A ou B), puis l'hôte lance la partie. Le chrono démarre tout de suite : pas de fiche à remplir.</li>
</ol>

<h2>🔒 Ton dossier secret</h2>
<ul>
  <li><b>Ton rôle</b> et ce que tu sais de la situation.</li>
  <li><b>Ta carte Motivation</b> : ton enjeu n°1 (celui qui rapporte le plus). L'autre camp va essayer de la deviner.</li>
  <li><b>Ta carte Plan B (BATNA)</b> : ce que tu gagnes s'il n'y a pas d'accord. Parfois c'est une <b>Ghost BATNA 👻</b> : elle ne vaut rien… sauf si tu bluffes bien.</li>
  <li><b>Ton barème</b> : les points que te rapporte chaque option. L'autre camp a un barème différent, et il ne le montre pas.</li>
  <li><b>L'ordre secret du boss 👔</b> (en équipe, et dès le niveau Intermédiaire en duo) : un seul joueur le reçoit. S'il est respecté : +${R.bossOk}, sinon ${R.bossFail}.</li>
</ul>

<h2>🗣️ Pendant la négociation</h2>
<ul>
  <li><b>Parlez !</b> La négociation se fait à l'oral (ou dans le chat si vous jouez à distance). L'appli sert à formaliser.</li>
  <li><b>📨 Faire une offre</b> : choisis une option par enjeu et envoie-la. Tu vois tout de suite combien elle te rapporte, mais jamais ce qu'elle rapporte à l'autre.</li>
  <li><b>🤝 Accepter une offre</b> : c'est le <b>DEAL</b>. La partie s'arrête et on passe à la révélation, même si le chrono n'est pas fini.</li>
  <li><b>🃏 Jouer une carte Argument</b> (prix du marché, loi, précédent…) : pose-la sur un enjeu et justifie-toi à l'oral. Certaines cartes sont des <b>bluffs</b> : tu dois alors inventer ton argument.
    L'autre camp choisit : <b>Accepter</b> (+${R.argAccepted} pour toi) ou <b>Contester</b> (si c'était un bluff : +${R.bluffCaught} pour lui, −${R.bluffCaught} pour toi ; si c'était vrai : −${R.falseAccusation} pour lui, +${R.falseAccusation} pour toi).</li>
  <li><b>🔎 Deviner la motivation adverse</b> (1 fois par camp) : +${R.guessRight} si c'est juste, ${R.guessWrong} sinon. Résultat à la révélation.</li>
  <li><b>👻 Démasquer le plan B adverse</b> (niveau Intermédiaire et plus, 1 fois) : si l'autre camp avait une Ghost BATNA, +${R.challengeWin} pour toi ; sinon ${R.challengeLose}.</li>
  <li><b>🚪 Quitter la table</b> : chacun repart avec son plan B. Si le tien était un fantôme : ${R.ghostWalk}.</li>
  <li><b>⚡ Cartes Événement</b> : l'appli en déclenche au hasard pendant la partie. Certaines sont publiques, d'autres <b>secrètes</b> (pour toi seul ou ton équipe) : un concurrent qui appelle, un plan B qui s'effondre, une tentation de trahison…</li>
</ul>

<h2>🏁 Fin de partie : la révélation</h2>
<p>Au gong (ou dès qu'un accord est signé), tous les secrets sont révélés. Chaque camp calcule ses points :</p>
<ul>
  <li><b>Accord signé</b> : les points de l'accord selon ton barème. <b>Pas d'accord</b> : ta BATNA (0 si fantôme).</li>
  <li>+ cartes Argument, déductions, ordre du boss, effets des événements.</li>
</ul>
<p>Qui gagne ? Ça dépend du type de scénario :</p>
<ul>
  <li><b>⚔️ Compétitif</b> : le meilleur total gagne.</li>
  <li><b>🤝 Coopératif</b> : vous gagnez <b>ensemble</b> si l'accord atteint l'objectif commun (somme des points des deux camps). Sinon, vous perdez ensemble.</li>
  <li><b>🎭 Semi-coopératif</b> : sans accord (ou sous l'objectif commun), tout le monde perd. Sinon, le meilleur total gagne.</li>
</ul>
<p>L'écran de fin vous attribue un <b>titre</b> (Requin de la négo, Bisounours, Casper le Bluffeur…), montre la <b>valeur créée</b> par rapport au meilleur accord possible, et propose <b>3 questions de débrief</b>.</p>

<h2>📶 Niveaux</h2>
<ul>
  <li><b>Débutant</b> : ${h.levels[1].events} événements, peu de bluffs, pas de Ghost BATNA, aides affichées.</li>
  <li><b>Intermédiaire</b> : ${h.levels[2].events} événements, Ghost BATNA possibles, ordre du boss en duo, démasquage.</li>
  <li><b>Expert</b> : ${h.levels[3].events} événements plus vicieux, 50 % de bluffs, aucune aide (pas d'alerte sous ta BATNA).</li>
</ul>
